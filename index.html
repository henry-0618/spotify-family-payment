<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Family 費用繳交紀錄表</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .badge-paid { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .badge-unpaid { background-color: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
        .badge-none { background-color: #f3f4f6; color: #6b7280; border: 1px solid #e5e7eb; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header & Nav -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-emerald-500 text-slate-900 p-2 rounded-xl font-bold">
                    <i class="fa-brands fa-spotify text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold leading-tight">Spotify Family 繳費紀錄</h1>
                    <p class="text-xs text-slate-400">成員繳費狀態追蹤面板</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <!-- Sync Status Badge -->
                <span id="syncStatus" class="hidden sm:inline-flex items-center text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700">
                    <span class="w-2 h-2 rounded-full bg-emerald-400 mr-2 animate-pulse"></span> 已連線至雲端
                </span>
                
                <!-- Admin Status / Login Toggle -->
                <button id="adminBtn" onclick="toggleAdminModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-medium px-4 py-2 rounded-lg transition-all flex items-center shadow-sm">
                    <i class="fa-solid fa-lock mr-2" id="adminIcon"></i>
                    <span id="adminBtnText">管理員登入</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-6">

        <!-- Top Status Bar & Config Notice -->
        <div id="gasConfigBanner" class="mb-6 bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-link text-amber-600 text-xl"></i>
                <div>
                    <div class="font-semibold text-sm">串接 Google 試算表 API</div>
                    <div class="text-xs text-amber-700">https://script.google.com/macros/s/AKfycbx0-ikyOtM7oHhVhTS0YmYJirM8En8nFIrqywq3vHIPkLI9mswvV-qCeMlWNpgVGv84/exec</div>
                </div>
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto">
                <input id="gasUrlInput" type="text" placeholder="https://script.google.com/macros/s/.../exec" class="w-full md:w-80 text-xs px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-amber-500">
                <button onclick="saveGasUrl()" class="bg-amber-600 text-white text-xs px-4 py-2 rounded-lg font-medium hover:bg-amber-700 whitespace-nowrap">保存連結</button>
            </div>
        </div>

        <!-- Mode Indicator Banner -->
        <div class="mb-6 flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <div class="flex items-center gap-2">
                <span id="roleBadge" class="bg-slate-100 text-slate-600 text-xs font-semibold px-2.5 py-1 rounded-md border border-slate-200">訪客模式（唯讀）</span>
                <span class="text-xs text-slate-500" id="roleDesc">登入管理員後點擊儲存格即可修改繳費狀態。</span>
            </div>
            <button onclick="fetchSheetData()" class="text-xs text-emerald-600 font-medium hover:underline flex items-center">
                <i class="fa-solid fa-rotate mr-1"></i> 重新整理資料
            </button>
        </div>

        <!-- Matrix Table Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-8">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="font-bold text-slate-800 flex items-center text-base">
                    <i class="fa-solid fa-table-cells mr-2 text-emerald-600"></i> 繳費紀錄矩陣表
                </h2>
                <div class="text-xs text-slate-500">
                    點擊欄位快速標記日期
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr id="tableHeader" class="bg-slate-100/70 border-b border-slate-200 text-slate-600 font-semibold">
                            <!-- Headers dynamically generated -->
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <!-- Rows dynamically generated -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Admin Login Modal -->
    <div id="adminModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold text-lg text-slate-800"><i class="fa-solid fa-shield-halved text-emerald-600 mr-2"></i>管理員身份驗證</h3>
                <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <p class="text-xs text-slate-500 mb-4">請輸入 Google Apps Script 中設定的管理員密碼以啟用編輯與同步權限。</p>
            <input type="password" id="adminPasswordInput" placeholder="請輸入密碼 (預設 admin123)" class="w-full text-sm px-3 py-2.5 border rounded-lg mb-4 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <div class="flex gap-2">
                <button onclick="toggleAdminModal()" class="w-1/2 text-slate-600 border border-slate-200 py-2 rounded-lg text-xs font-medium hover:bg-slate-50">取消</button>
                <button onclick="verifyAdmin()" class="w-1/2 bg-emerald-600 text-white py-2 rounded-lg text-xs font-medium hover:bg-emerald-700">登入管理模式</button>
            </div>
        </div>
    </div>

    <!-- Edit Status Modal -->
    <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 id="editModalTitle" class="font-bold text-slate-800 text-base">更新繳費狀態</h3>
                    <p id="editModalSubtitle" class="text-xs text-slate-500"></p>
                </div>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- Quick Action Buttons -->
            <div class="grid grid-cols-2 gap-2 mb-4">
                <button onclick="setQuickStatus('paidToday')" class="p-3 bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 rounded-xl text-left transition-all">
                    <div class="text-xs font-bold text-emerald-800 mb-1"><i class="fa-solid fa-check-circle text-emerald-600 mr-1"></i> 已繳交 (標記今天)</div>
                    <div class="text-[10px] text-emerald-600" id="todayLabel">自動產生：已繳交 09/20</div>
                </button>
                <button onclick="setQuickStatus('paidTransfer')" class="p-3 bg-teal-50 border border-teal-200 hover:bg-teal-100 rounded-xl text-left transition-all">
                    <div class="text-xs font-bold text-teal-800 mb-1"><i class="fa-solid fa-money-bill-transfer text-teal-600 mr-1"></i> 已繳交 (轉帳)</div>
                    <div class="text-[10px] text-teal-600">填入：已繳交(轉帳)</div>
                </button>
                <button onclick="setQuickStatus('unpaid')" class="p-3 bg-rose-50 border border-rose-200 hover:bg-rose-100 rounded-xl text-left transition-all">
                    <div class="text-xs font-bold text-rose-800 mb-1"><i class="fa-solid fa-triangle-exclamation text-rose-600 mr-1"></i> 缺 / 未繳交</div>
                    <div class="text-[10px] text-rose-600">標記為：缺</div>
                </button>
                <button onclick="setQuickStatus('none')" class="p-3 bg-slate-50 border border-slate-200 hover:bg-slate-100 rounded-xl text-left transition-all">
                    <div class="text-xs font-bold text-slate-700 mb-1"><i class="fa-solid fa-minus-circle text-slate-400 mr-1"></i> 未加入 / X</div>
                    <div class="text-[10px] text-slate-500">填入：X</div>
                </button>
            </div>

            <!-- Custom Input Field -->
            <div class="mb-4">
                <label class="block text-xs font-medium text-slate-700 mb-1">或自訂註記狀態</label>
                <input type="text" id="customStatusInput" class="w-full text-xs p-2.5 border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none" placeholder="例如：已繳交09/25">
            </div>

            <div class="flex gap-2">
                <button onclick="closeEditModal()" class="w-1/3 text-slate-600 border border-slate-200 py-2 rounded-lg text-xs font-medium hover:bg-slate-50">取消</button>
                <button onclick="applyCustomStatus()" class="w-2/3 bg-emerald-600 text-white py-2 rounded-lg text-xs font-medium hover:bg-emerald-700">更新並儲存</button>
            </div>
        </div>
    </div>

    <script>
        // Initial Data Structure based on spreadsheet
        let matrixData = [
            ["姓名", "e-mail", "2026/03", "2026/04", "2026/05", "2026/06", "2026/07", "2026/08", "2026/09", "2026/10"],
            ["筱玟", "joannalee197509@gmail.com", "已繳交", "已繳交", "已繳交", "已繳交(轉帳)", "已繳交09/16", "已繳交09/16", "已繳交09/16", ""],
            ["松澤", "jason1041387@gmail.com", "已繳交", "已繳交", "已繳交", "已繳交", "已繳交", "已繳交", "已繳交09/11", ""],
            ["岑菲", "zhangcenfei9@gmail.com", "已繳交", "已繳交", "已繳交", "已繳交", "已繳交", "已繳交", "缺", ""],
            ["祐丞", "", "X", "X", "X", "X", "X", "", "已繳交09/14", ""],
            ["宗佑", "zuuulin@gmail.com", "已繳交", "已繳交", "已繳交", "", "", "X", "X", ""],
            ["育陞", "leo2018lin@gmail.com", "已繳交", "已繳交", "已繳交", "已繳交", "已繳交", "已繳交", "缺", ""]
        ];

        let isAdmin = false;
        let adminPassword = "";
        let gasUrl = localStorage.getItem("spotify_gas_url") || "";
        let currentEditingCell = null; // { rowIndex, colIndex }

        window.onload = function() {
            if (gasUrl) {
                document.getElementById('gasUrlInput').value = gasUrl;
                fetchSheetData();
            } else {
                renderTable();
            }
            updateTodayLabel();
        };

        function updateTodayLabel() {
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('todayLabel').innerText = `自動產生：已繳交 ${month}/${day}`;
        }

        function saveGasUrl() {
            const url = document.getElementById('gasUrlInput').value.trim();
            if (!url) return alert("請輸入有效的 Apps Script 網址");
            gasUrl = url;
            localStorage.setItem("spotify_gas_url", gasUrl);
            alert("GAS API 網址已保存！將開始同步資料...");
            fetchSheetData();
        }

        async function fetchSheetData() {
            if (!gasUrl) return;
            try {
                const res = await fetch(gasUrl);
                const result = await res.json();
                if (result.status === "success" && result.data && result.data.length > 0) {
                    matrixData = result.data;
                    renderTable();
                }
            } catch (err) {
                console.error("Fetch Error:", err);
            }
        }

        function renderTable() {
            const headerRow = document.getElementById('tableHeader');
            const body = document.getElementById('tableBody');
            headerRow.innerHTML = '';
            body.innerHTML = '';

            // Header
            matrixData[0].forEach((col, idx) => {
                const th = document.createElement('th');
                th.className = 'py-3 px-3 font-semibold text-slate-700 whitespace-nowrap' + (idx < 2 ? ' bg-slate-100 sticky left-0 z-10' : '');
                th.innerText = col;
                headerRow.appendChild(th);
            });

            // Rows
            for (let r = 1; r < matrixData.length; r++) {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/80 transition-colors';

                for (let c = 0; c < matrixData[r].length; c++) {
                    const td = document.createElement('td');
                    td.className = 'py-2.5 px-3 whitespace-nowrap text-xs border-slate-100 border-b' + (c < 2 ? ' font-medium text-slate-800 bg-white sticky left-0 shadow-sm' : '');
                    
                    const val = matrixData[r][c] || '';
                    if (c >= 2) {
                        td.innerHTML = getStatusBadgeHTML(val);
                        if (isAdmin) {
                            td.className += ' cursor-pointer hover:bg-emerald-50/50 transition-all';
                            td.onclick = () => openEditModal(r, c);
                        }
                    } else {
                        td.innerText = val;
                    }
                    tr.appendChild(td);
                }
                body.appendChild(tr);
            }
        }

        function getStatusBadgeHTML(val) {
            if (!val) return `<span class="text-slate-300">-</span>`;
            if (val.includes('已繳交')) {
                return `<span class="badge-paid px-2 py-1 rounded-md text-[11px] font-medium inline-flex items-center"><i class="fa-solid fa-check mr-1 text-[10px]"></i>${val}</span>`;
            } else if (val === '缺' || val.includes('未繳交')) {
                return `<span class="badge-unpaid px-2 py-1 rounded-md text-[11px] font-bold inline-flex items-center"><i class="fa-solid fa-xmark mr-1 text-[10px]"></i>${val}</span>`;
            } else if (val === 'X') {
                return `<span class="badge-none px-2 py-1 rounded-md text-[11px] text-slate-400">X</span>`;
            } else {
                return `<span class="bg-slate-100 text-slate-700 px-2 py-1 rounded-md text-[11px] border border-slate-200">${val}</span>`;
            }
        }

        function toggleAdminModal() {
            const modal = document.getElementById('adminModal');
            modal.classList.toggle('hidden');
        }

        function verifyAdmin() {
            const pwd = document.getElementById('adminPasswordInput').value;
            if (!pwd) return alert("請輸入密碼");
            
            adminPassword = pwd;
            isAdmin = true;
            
            // Update UI State
            document.getElementById('roleBadge').className = 'bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-md border border-emerald-200';
            document.getElementById('roleBadge').innerText = '管理員模式（可點擊修改）';
            document.getElementById('adminBtn').className = 'bg-slate-700 hover:bg-slate-600 text-white text-sm font-medium px-4 py-2 rounded-lg transition-all flex items-center shadow-sm';
            document.getElementById('adminBtnText').innerText = '已登入管理員';
            document.getElementById('adminIcon').className = 'fa-solid fa-unlock text-emerald-400 mr-2';

            toggleAdminModal();
            renderTable();
        }

        function openEditModal(r, c) {
            if (!isAdmin) return;
            currentEditingCell = { rowIndex: r, colIndex: c };
            const name = matrixData[r][0];
            const month = matrixData[0][c];
            document.getElementById('editModalSubtitle').innerText = `${name} - ${month} 繳費狀態`;
            document.getElementById('customStatusInput').value = matrixData[r][c] || '';
            document.getElementById('editModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            currentEditingCell = null;
        }

        function setQuickStatus(type) {
            if (!currentEditingCell) return;
            let statusStr = "";
            const today = new Date();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');

            if (type === 'paidToday') {
                statusStr = `已繳交${month}/${day}`;
            } else if (type === 'paidTransfer') {
                statusStr = "已繳交(轉帳)";
            } else if (type === 'unpaid') {
                statusStr = "缺";
            } else if (type === 'none') {
                statusStr = "X";
            }

            saveCellChange(statusStr);
        }

        function applyCustomStatus() {
            const val = document.getElementById('customStatusInput').value.trim();
            saveCellChange(val);
        }

        async function saveCellChange(newVal) {
            if (!currentEditingCell) return;
            const { rowIndex, colIndex } = currentEditingCell;
            matrixData[rowIndex][colIndex] = newVal;
            
            renderTable();
            closeEditModal();

            // Sync to Google Apps Script Backend
            if (gasUrl && isAdmin) {
                try {
                    const res = await fetch(gasUrl, {
                        method: 'POST',
                        body: JSON.stringify({
                            password: adminPassword,
                            matrix: matrixData
                        })
                    });
                    const result = await res.json();
                    if (result.status !== 'success') {
                        alert("同步失敗：" + result.message);
                    }
                } catch (e) {
                    alert("網路連線或 API 存取錯誤：" + e.toString());
                }
            }
        }
    </script>
</body>
</html>
